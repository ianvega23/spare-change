name: invest

# One run of the money path every weekday. It buys only on your buy day (Monday by default),
# and only once a week; other days it just collects round-ups. Off until you opt in by setting
# the repository variable SPARE_ENABLED to "true" in your own private copy.
on:
  schedule:
    - cron: "0 15 * * 1-5"   # 15:00 UTC, weekdays, while the US market is open
  workflow_dispatch:

permissions:
  contents: write   # only to commit the ledger to the state branch

concurrency:
  group: invest     # never two money runs at once
  cancel-in-progress: false

jobs:
  invest:
    if: vars.SPARE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: money   # bank + broker secrets live only here, limited to the main branch
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Check out the state branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin state >/dev/null; then
            git fetch --depth 1 origin state
            git worktree add state FETCH_HEAD
            git -C state switch -c state
          else
            git worktree add --orphan -b state state
          fi

      - name: Write the Teller certificate to a private temp folder (Teller users only; empty with Plaid)
        env:
          TELLER_CERT_PEM: ${{ secrets.TELLER_CERT_PEM }}
          TELLER_KEY_PEM: ${{ secrets.TELLER_KEY_PEM }}
        run: |
          umask 077
          dir="$RUNNER_TEMP/teller"; mkdir -p "$dir"
          printf '%s\n' "$TELLER_CERT_PEM" > "$dir/certificate.pem"
          printf '%s\n' "$TELLER_KEY_PEM" > "$dir/private_key.pem"
          echo "TELLER_CERT=$dir/certificate.pem" >> "$GITHUB_ENV"
          echo "TELLER_KEY=$dir/private_key.pem" >> "$GITHUB_ENV"

      - name: Invest
        env:
          SPARE_STATE_DIR: state
          TELLER_ACCESS_TOKEN: ${{ secrets.TELLER_ACCESS_TOKEN }}
          PLAID_CLIENT_ID: ${{ secrets.PLAID_CLIENT_ID }}
          PLAID_SECRET: ${{ secrets.PLAID_SECRET }}
          PLAID_ACCESS_TOKEN: ${{ secrets.PLAID_ACCESS_TOKEN }}
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          PUBLIC_SECRET_KEY: ${{ secrets.PUBLIC_SECRET_KEY }}
        run: python -m spare invest

      - name: Commit the ledger to the state branch
        if: always()   # record what happened even when the run failed
        run: |
          cd state
          for f in ledger.jsonl last_run.json outbox shadow.jsonl valuation.json; do
            if [ -e "$f" ]; then git add -- "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "Nothing new to record."
          else
            git commit -q -m "invest run $(date -u +%Y-%m-%d)"
            for attempt in 1 2 3; do  # the bot job may have pushed in between
              git push origin state && break
              git pull --rebase origin state
            done
          fi

      - name: Remove the certificate
        if: always()
        run: rm -rf "$RUNNER_TEMP/teller"
