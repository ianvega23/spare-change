name: evals

# Live allocator evals against the real model, for pull requests that change the AI code or prompts.
# Fails if guardrail compliance, profile fit or injection safety drops below evals/baseline.json.
# Needs an `evals` environment holding ANTHROPIC_API_KEY (kept apart from `ai`, which only main uses).
# Off until you opt in by setting the repository variable SPARE_LIVE_EVALS to "true".
on:
  pull_request:
    paths:
      - "spare/brain/**"
      - "evals/**"
  workflow_dispatch:
    inputs:
      sample:
        description: "Profiles and attacks to use (blank = all 60 and 50)"
        required: false

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    if: vars.SPARE_LIVE_EVALS == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: evals
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install the Claude SDK (hash-pinned)
        run: python -m pip install --require-hashes --no-deps -r requirements-ai.txt
      - name: Live evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SAMPLE: ${{ inputs.sample || '20' }}
        run: python -m spare eval --live --sample "$SAMPLE"
