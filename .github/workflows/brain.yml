name: brain

# Sunday allocation review and weekly update. Holds only the Anthropic key, so it can't reach your bank or broker.
# It writes a small change to targets.json, or a proposal that waits for your Approve in Telegram.
# Off until you opt in by setting the repository variable SPARE_ENABLED to "true".
on:
  schedule:
    - cron: "0 16 * * 0"
  workflow_dispatch:

permissions:
  contents: write   # only to commit the result to the state branch

concurrency:
  group: brain
  cancel-in-progress: false

jobs:
  brain:
    if: vars.SPARE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ai   # the Anthropic key lives only here
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install the Claude SDK (hash-pinned)
        run: python -m pip install --require-hashes --no-deps -r requirements-ai.txt

      - name: Check out the state branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin state >/dev/null; then
            git fetch --depth 1 origin state
            git worktree add state FETCH_HEAD
            git -C state switch -c state
          else
            echo "No state branch yet: the invest job creates it on its first run."
            exit 0
          fi

      - name: Allocation review
        if: hashFiles('state/**') != ''
        env:
          SPARE_STATE_DIR: state
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m spare brain

      - name: Weekly update
        if: always() && hashFiles('state/**') != ''
        env:
          SPARE_STATE_DIR: state
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m spare weekly

      - name: Commit the result to the state branch
        if: always() && hashFiles('state/**') != ''
        run: |
          cd state
          for f in targets.json proposals decisions.jsonl telemetry.jsonl brain.json categories.json outbox; do
            if [ -e "$f" ] || git ls-files --error-unmatch "$f" >/dev/null 2>&1; then git add -A -- "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "Nothing new to record."
          else
            git commit -q -m "brain run $(date -u +%Y-%m-%dT%H:%M)"
            for attempt in 1 2 3; do  # another job may have pushed in between
              git push origin state && break
              git pull --rebase origin state
            done
          fi
