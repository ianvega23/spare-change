# Copy to config.toml (git-ignored) and edit. Dollar amounts are in US dollars.
# Limits here can only make the guardrails stricter, never looser.

enabled = true          # false = kill switch: every run logs and exits
dry_run = true          # true = plan buys and print them, place no orders
alpaca_env = "paper"    # "paper" or "live" (live also needs a passed paper checklist)
broker = "alpaca"       # "alpaca" or "public" (Public is live only: orders wait for the checklist)
public_account_id = ""  # Public: empty = your one brokerage account

multiplier = 1          # round-up multiplier: 1, 2 or 3
buy_day = "monday"      # invest the week's round-ups once a week, on this weekday
monthly_cap = 200       # most dollars invested per calendar month

bank = "teller"                   # "teller" (default) or "plaid"
bank_environment = "production"   # Teller: sandbox, development or production
bank_account_id = ""              # empty = your one open checking account
teller_spending_sign = "negative" # how Teller signs purchases; `spare bank-check` shows it

allow_stocks = false    # true = individual S&P 500 stocks may be proposed

allocator_model = "claude-opus-5-5"  # picks the weekly allocation
cheap_model = "claude-haiku-5-5"     # categorizing and the weekly summary (phase 7)
ai_monthly_budget = 2.00             # the brain job skips once this month's AI spend reaches it
send_merchants_to_ai = true          # false = merchant names never leave GitHub; the weekly update
                                     # then shows no spending categories beyond simple rules

[limits]                # optional; each value may only be stricter than the default
# min_holdings = 5
# max_etf_weight = 0.35
# max_stock_weight = 0.10
# max_stocks_total = 0.30
